name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54331/postgres
  SUPABASE_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres

jobs:
  verify:
    name: Typecheck, RLS, build, E2E
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test

      # Real PostgreSQL + the real migrations. Starts the container itself.
      - run: npm run test:db

      # Same policies through @supabase/supabase-js -> PostgREST -> Postgres.
      - run: npm run test:rest

      # Real GoTrue/PostgREST for the auth E2E suite, then .env.local from it.
      - run: npx supabase start
      - run: npx supabase db reset
      - run: npm run supabase:env

      # MCP tools and protocol against the same local stack.
      - run: npm run test:mcp

      # Private Storage bucket policies with two users.
      - run: npm run test:storage

      - run: npm run build

      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
