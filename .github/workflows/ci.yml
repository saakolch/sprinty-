name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Placeholders: the build and the smoke tests must not depend on a real
  # Supabase project. RLS tests use the disposable Postgres container.
  NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-publishable-key
  SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key
  DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres

jobs:
  verify:
    name: Typecheck, RLS, build, E2E
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test

      # Real PostgreSQL + the real migrations. Starts the container itself.
      - run: npm run test:db

      # Same policies through @supabase/supabase-js -> PostgREST -> Postgres.
      - run: npm run test:rest

      - run: npm run build

      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
